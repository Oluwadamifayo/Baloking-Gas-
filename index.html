<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baloking Gas | Premium Industrial Storefront</title>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --accent-orange: #f97316;
            --accent-orange-hover: #ea580c;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            padding-bottom: 60px;
        }

        header {
            background-color: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 800;
            font-size: 1.3rem;
            letter-spacing: -0.05em;
            color: var(--text-primary);
        }

        .logo span {
            color: var(--accent-orange);
        }

        .admin-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.375rem;
            transition: all 0.2s;
        }

        .admin-btn:hover {
            border-color: var(--accent-orange);
            color: var(--text-primary);
        }

        .hero {
            max-width: 1200px;
            margin: 2.5rem auto 1.5rem;
            padding: 0 1.5rem;
            text-align: center;
        }

        .hero h1 {
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            max-width: 800px;
            margin: 2rem auto 3rem;
        }

        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 12px;
            text-align: center;
        }

        .metric-card h3 {
            color: var(--accent-orange);
            font-size: 1.25rem;
            margin-bottom: 0.25rem;
        }

        .metric-card p {
            color: var(--text-secondary);
            font-size: 0.75rem;
            margin: 0;
        }

        .store-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: #475569;
        }

        .img-container {
            width: 100%;
            height: 240px;
            background-color: #151f32;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            padding: 0.25rem 0.625rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-instock {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
        }

        .badge-outstock {
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        .product-info {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.125rem;
            font-weight: 700;
            margin-bottom: 1.25rem;
        }

        .price-row {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .price-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .price-val {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .order-btn {
            width: 100%;
            background-color: var(--accent-orange);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: background-color 0.2s;
            text-decoration: none;
        }

        .order-btn:hover {
            background-color: var(--accent-orange-hover);
        }

        .order-btn.disabled {
            background-color: #334155 !important;
            color: #64748b !important;
            cursor: not-allowed;
            pointer-events: none;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            width: 90%;
            max-width: 420px;
            padding: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 0.375rem;
        }

        .form-control {
            width: 100%;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            padding: 0.625rem;
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-orange);
        }

        @media (max-width: 640px) {
            .metrics-grid {
                grid-template-columns: 1fr;
                gap: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo">
                <i data-lucide="flame" style="color: var(--accent-orange)"></i>
                BALOKING <span>GAS</span>
            </div>
            <button class="admin-btn" onclick="openAuthModal()">
                <i data-lucide="shield-alert" size="16"></i> Admin Control
            </button>
        </div>
    </header>

    <main class="hero">
        <h1>Industrial Gas & Supply Depot</h1>
        <div class="metrics-grid">
            <div class="metric-card">
                <h3>100%</h3>
                <p>Safety Certified</p>
            </div>
            <div class="metric-card">
                <h3>24/7</h3>
                <p>Rapid Dispatch</p>
            </div>
            <div class="metric-card">
                <h3>SON</h3>
                <p>Standard Approved</p>
            </div>
        </div>
    </main>

    <section class="store-container">
        <div class="products-grid" id="storefront-grid">
            </div>
    </section>

    <div class="modal-overlay" id="authModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 style="font-weight: 700;">Security Clearance</h3>
                <button class="modal-close" onclick="closeModal('authModal')"><i data-lucide="x"></i></button>
            </div>
            <div class="form-group">
                <label>Enter Access Pin</label>
                <input type="password" class="form-control" id="accessPin" placeholder="••••••••">
            </div>
            <button class="order-btn" onclick="verifyAccess()">Verify Identity</button>
        </div>
    </div>

    <div class="modal-overlay" id="adminModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 style="font-weight: 700;">Inventory Modifier</h3>
                <button class="modal-close" onclick="closeModal('adminModal')"><i data-lucide="x"></i></button>
            </div>
            <div class="form-group">
                <label>Select Target Inventory Unit</label>
                <select class="form-control" id="targetProduct" onchange="loadProductMetadata()">
                </select>
            </div>
            <div class="form-group">
                <label>Set Rate Surcharge (₦)</label>
                <input type="number" class="form-control" id="modifyPrice">
            </div>
            <div class="form-group">
                <label>Availability Matrix Status</label>
                <select class="form-control" id="modifyStock">
                    <option value="true">In Stock</option>
                    <option value="false">Out of Stock / Restocking</option>
                </select>
            </div>
            <button class="order-btn" onclick="applySystemModifications()">Publish Modifications</button>
        </div>
    </div>

    <script>
        let products = [
            {
                id: "item-6kg",
                name: "6kg Gas Cylinder",
                price: 25000,
                inStock: true,
                imgUrl: "https://i.ibb.co/9Hc50q0R/ed7820892edd24e6caa799cc38b7aab4.jpg"
            },
            {
                id: "item-12kg",
                name: "12.5kg Gas Cylinder",
                price: 45000,
                inStock: true,
                imgUrl: "https://images.unsplash.com/photo-1626264290756-12ef24a76def?auto=format&fit=crop&w=400&q=80"
            },
            {
                id: "item-regulator",
                name: "High-Pressure Regulator",
                price: 12000,
                inStock: true,
                imgUrl: "https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=400&q=80"
            }
        ];

        function renderStorefront() {
            const grid = document.getElementById('storefront-grid');
            grid.innerHTML = '';

            products.forEach(p => {
                const badgeClass = p.inStock ? 'badge-instock' : 'badge-outstock';
                const badgeText = p.inStock ? 'Available' : 'Out of Stock';
                const btnDisabled = p.inStock ? '' : 'disabled';
                const btnText = p.inStock ? 'Order via WhatsApp' : 'Restocking';

                const messageText = encodeURIComponent(`Hello Baloking Gas, I want to purchase the ${p.name} currently listed at ₦${p.price.toLocaleString()}. Please confirm availability.`);
                const whatsappUrl = `https://wa.me/2348123456789?text=${messageText}`;

                grid.innerHTML += `
                    <div class="product-card">
                        <div class="img-container">
                            <img src="${p.imgUrl}" alt="${p.name}">
                            <span class="badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="product-info">
                            <h3 class="product-title">${p.name}</h3>
                            <div class="price-row">
                                <span class="price-label">Price</span>
                                <span class="price-val">₦${p.price.toLocaleString()}</span>
                            </div>
                            <a href="${whatsappUrl}" target="_blank" class="order-btn ${btnDisabled}">
                                <i data-lucide="phone"></i> ${btnText}
                            </a>
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        function populateAdminOptions() {
            const selector = document.getElementById('targetProduct');
            selector.innerHTML = '';
            products.forEach(p => {
                selector.innerHTML += `<option value="${p.id}">${p.name}</option>`;
            });
        }

        function loadProductMetadata() {
            const targetId = document.getElementById('targetProduct').value;
            const item = products.find(p => p.id === targetId);
            if (item) {
                document.getElementById('modifyPrice').value = item.price;
                document.getElementById('modifyStock').value = item.inStock.toString();
            }
        }

        function openAuthModal() {
            document.getElementById('accessPin').value = '';
            document.getElementById('authModal').classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function verifyAccess() {
            const inputPin = document.getElementById('accessPin').value;
            if (inputPin === 'admin123') {
                closeModal('authModal');
                populateAdminOptions();
                loadProductMetadata();
                document.getElementById('adminModal').classList.add('active');
            } else {
                alert('Invalid Security Credentials.');
            }
        }

        function applySystemModifications() {
            const targetId = document.getElementById('targetProduct').value;
            const updatedPrice = parseFloat(document.getElementById('modifyPrice').value);
            const updatedStock = document.getElementById('modifyStock').value === 'true';

            const idx = products.findIndex(p => p.id === targetId);
            if (idx !== -1) {
                products[idx].price = updatedPrice;
                products[idx].inStock = updatedStock;
                renderStorefront();
                closeModal('adminModal');
            }
        }

        window.onload = function() {
            renderStorefront();
        };
    </script>
</body>
</html>
