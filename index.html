<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baloking Gas | Premium Industrial Storefront</title>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --accent-orange: #f97316;
            --accent-orange-hover: #ea580c;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            padding-bottom: 120px;
        }

        header {
            background-color: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 800;
            font-size: 1.3rem;
            letter-spacing: -0.05em;
            color: var(--text-primary);
        }

        .logo span {
            color: var(--accent-orange);
        }

        .admin-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.375rem;
            transition: all 0.2s;
        }

        .admin-btn:hover {
            border-color: var(--accent-orange);
            color: var(--text-primary);
        }

        .hero {
            max-width: 1200px;
            margin: 2.5rem auto 1.5rem;
            padding: 0 1.5rem;
            text-align: center;
        }

        .hero h1 {
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
        }

        .hero p {
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 1.5rem;
            font-size: 1rem;
            line-height: 1.5;
        }

        .search-container {
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            color: var(--text-secondary);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.85rem 1rem 0.85rem 2.75rem;
            color: white;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
        }

        .store-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem 0;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: #475569;
        }

        .img-container {
            width: 100%;
            height: 240px;
            background-color: #f1f5f9;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 1rem;
        }

        .img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .badge {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            padding: 0.25rem 0.625rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            z-index: 10;
        }

        .badge-instock {
            background-color: rgba(16, 185, 129, 0.9);
            color: #ffffff;
        }

        .badge-lowstock {
            background-color: rgba(245, 158, 11, 0.9);
            color: #ffffff;
        }

        .badge-outstock {
            background-color: rgba(239, 68, 68, 0.9);
            color: #ffffff;
        }

        .product-info {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.125rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .stock-indicator {
            font-size: 0.825rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .price-row {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .price-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .price-val {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .quantity-control {
            display: flex;
            align-items: center;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .qty-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: background 0.2s;
        }

        .qty-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .qty-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: white;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 600;
            width: 100%;
        }

        .qty-input:focus {
            outline: none;
        }

        .order-btn {
            width: 100%;
            background-color: var(--accent-orange);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: background-color 0.2s;
            text-decoration: none;
        }

        .order-btn:hover {
            background-color: var(--accent-orange-hover);
        }

        .order-btn.disabled {
            background-color: #334155 !important;
            color: #64748b !important;
            cursor: not-allowed;
            pointer-events: none;
        }

        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
            z-index: 90;
            display: none;
            box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.3);
        }

        .cart-bar-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
        }

        .cart-summary-text {
            display: flex;
            flex-direction: column;
        }

        .cart-summary-title {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .cart-summary-total {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .cart-checkout-btn {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 0.85rem 1.75rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.625rem;
            transition: filter 0.2s;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.25);
        }

        .cart-checkout-btn:hover {
            filter: brightness(0.9);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            width: 90%;
            max-width: 420px;
            padding: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 0.375rem;
        }

        .form-control {
            width: 100%;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            padding: 0.625rem;
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-orange);
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo">
                <i data-lucide="flame" style="color: var(--accent-orange)"></i>
                BALOKING <span>GAS</span>
            </div>
            <button class="admin-btn" onclick="openAuthModal()">
                <i data-lucide="shield-alert" size="16"></i> Admin Control
            </button>
        </div>
    </header>

    <main class="hero">
        <h1>Industrial Gas & Supply Depot</h1>
        <p>Premium grade LPG distribution, safety certified cylinders, and accessories delivered directly safely with absolute speed precision.</p>
        
        <div class="search-container">
            <i data-lucide="search" class="search-icon" size="18"></i>
            <input type="text" id="storeSearch" class="search-input" placeholder="Search cylinders or accessories..." oninput="renderStorefront()">
        </div>
    </main>

    <section class="store-container">
        <div class="products-grid" id="storefront-grid">
            </div>
    </section>

    <div class="cart-bar" id="globalCartBar">
        <div class="cart-bar-container">
            <div class="cart-summary-text">
                <span class="cart-summary-title" id="cartSummaryItems">Selected Items (0)</span>
                <span class="cart-summary-total" id="cartSummaryTotal">₦0</span>
            </div>
            <button class="cart-checkout-btn" onclick="sendCartToWhatsApp()">
                <i data-lucide="send"></i> Send Order via WhatsApp
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="authModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 style="font-weight: 700;">Security Clearance</h3>
                <button class="modal-close" onclick="closeModal('authModal')"><i data-lucide="x"></i></button>
            </div>
            <div class="form-group">
                <label>Enter Access Pin</label>
                <input type="password" class="form-control" id="accessPin" placeholder="••••••••">
            </div>
            <button class="order-btn" onclick="verifyAccess()">Verify Identity</button>
        </div>
    </div>

    <div class="modal-overlay" id="adminModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 style="font-weight: 700;">Inventory Modifier</h3>
                <button class="modal-close" onclick="closeModal('adminModal')"><i data-lucide="x"></i></button>
            </div>
            <div class="form-group">
                <label>Select Target Inventory Unit</label>
                <select class="form-control" id="targetProduct" onchange="loadProductMetadata()">
                </select>
            </div>
            <div class="form-group">
                <label>Set Rate Surcharge (₦)</label>
                <input type="number" class="form-control" id="modifyPrice">
            </div>
            <div class="form-group">
                <label>Available Quantity (Units)</label>
                <input type="number" class="form-control" id="modifyStockCount" min="0" placeholder="0">
            </div>
            <button class="order-btn" onclick="applySystemModifications()">Publish Modifications</button>
        </div>
    </div>

    <script>
        let products = [
            {
                id: "item-6kg",
                name: "6kg Gas Cylinder",
                price: 25000,
                stockCount: 12,
                imgUrl: "https://i.ibb.co/9Hc50q0R/ed7820892edd24e6caa799cc38b7aab4.jpg"
            },
            {
                id: "item-12kg",
                name: "12.5kg Gas Cylinder",
                price: 45000,
                stockCount: 8,
                imgUrl: "https://i.ibb.co/PZQXrGXw/f28e977d5556d9d71f0d922d39a8fef1.jpg"
            },
            {
                id: "item-regulator",
                name: "Standard Transfer",
                price: 12000,
                stockCount: 25,
                imgUrl: "https://i.ibb.co/Xx43kWVH/93bd0db653a87dd5ded9c5dbb51af212.jpg"
            },
            {
                id: "item-accessory",
                name: "60kg Cylinder",
                price: 15000,
                stockCount: 5,
                imgUrl: "https://i.ibb.co/JwJXMVNk/a23ab44c0e9f8e242b442dcbc1a1a9d9.jpg"
            },
            {
                id: "item-6kg-complete",
                name: "6kg Complete Set",
                price: 25000,
                stockCount: 10,
                imgUrl: "https://i.ibb.co/wF3VFP10/5455f349d94656570c5463b79a1ae831.jpg"
            },
            {
                id: "item-burner-complete",
                name: "Stainless Burner Complete",
                price: 15000,
                stockCount: 18,
                imgUrl: "https://i.ibb.co/nMGDRhvq/0157748126000e8e204725918e72bae3.jpg"
            },
            {
                id: "item-white-hose",
                name: "White Hose Bundle",
                price: 8000,
                stockCount: 15,
                imgUrl: "https://i.ibb.co/7tWfYZb6/695d126f2b0aeb1f6adcfd34636a228f.jpg"
            },
            {
                id: "item-orange-hose",
                name: "Orange Hose Bundle",
                price: 8000,
                stockCount: 15,
                imgUrl: "https://i.ibb.co/mFhzf0WR/8adc628a1102026a4cbb8cab7bad76af.jpg"
            }
        ];

        let cartState = {};

        function changeQty(productId, amount) {
            const product = products.find(p => p.id === productId);
            if (!product || product.stockCount <= 0) return;

            const input = document.getElementById(`qty-${productId}`);
            if (!input) return;
            
            let currentQty = parseInt(input.value) || 0;
            let newQty = currentQty + amount;
            
            if (newQty > product.stockCount) {
                alert(`Cannot exceed available stock limit (${product.stockCount} units remaining)`);
                newQty = product.stockCount;
            }
            newQty = Math.max(0, newQty);
            
            input.value = newQty;
            updateCartState(productId, newQty);
        }

        function handleQtyInput(productId, value) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            let parsed = parseInt(value);
            if (isNaN(parsed) || parsed < 0) parsed = 0;
            
            if (parsed > product.stockCount) {
                alert(`Stock cap reached. Only ${product.stockCount} units available.`);
                parsed = product.stockCount;
                document.getElementById(`qty-${productId}`).value = parsed;
            }
            
            updateCartState(productId, parsed);
        }

        function updateCartState(productId, qty) {
            if (qty > 0) {
                cartState[productId] = qty;
            } else {
                delete cartState[productId];
            }
            calculateCartTotals();
        }

        function calculateCartTotals() {
            let totalItemsCount = 0;
            let totalCurrencyCost = 0;

            Object.keys(cartState).forEach(pid => {
                const product = products.find(p => p.id === pid);
                if (product) {
                    const quantity = cartState[pid];
                    totalItemsCount += quantity;
                    totalCurrencyCost += (product.price * quantity);
                }
            });

            const cartBar = document.getElementById('globalCartBar');
            if (totalItemsCount > 0) {
                cartBar.style.display = 'block';
                document.getElementById('cartSummaryItems').innerText = `Selected Items (${totalItemsCount})`;
                document.getElementById('cartSummaryTotal').innerText = `₦${totalCurrencyCost.toLocaleString()}`;
            } else {
                cartBar.style.display = 'none';
            }
        }

        function sendCartToWhatsApp() {
            if (Object.keys(cartState).length === 0) return;

            let messageString = "Hello Baloking Gas, I would like to place an order for the following items:\n\n";
            let totalCost = 0;

            Object.keys(cartState).forEach((pid, index) => {
                const product = products.find(p => p.id === pid);
                if (product) {
                    const qty = cartState[pid];
                    const dynamicSubtotal = product.price * qty;
                    totalCost += dynamicSubtotal;
                    messageString += `${index + 1}. *${product.name}*\n   Quantity: ${qty}\n   Subtotal: ₦${dynamicSubtotal.toLocaleString()}\n\n`;
                }
            });

            messageString += `*Total Order Value:* ₦${totalCost.toLocaleString()}\n\nPlease confirm availability and delivery terms.`;
            
            const universalEncodedText = encodeURIComponent(messageString);
            const targetWhatsAppEndpoint = `https://wa.me/2348160922263?text=${universalEncodedText}`;
            
            window.open(targetWhatsAppEndpoint, '_blank');
        }

        function renderStorefront() {
            const grid = document.getElementById('storefront-grid');
            grid.innerHTML = '';

            const searchQuery = (document.getElementById('storeSearch')?.value || '').toLowerCase().trim();

            products.forEach(p => {
                if (searchQuery && !p.name.toLowerCase().includes(searchQuery)) {
                    return; 
                }

                let badgeClass = 'badge-instock';
                let badgeText = 'Available';
                let isAvailable = true;

                if (p.stockCount <= 0) {
                    badgeClass = 'badge-outstock';
                    badgeText = 'Out of Stock';
                    isAvailable = false;
                } else if (p.stockCount <= 3) {
                    badgeClass = 'badge-lowstock';
                    badgeText = 'Low Stock';
                }
                
                const btnDisabled = isAvailable ? '' : 'disabled';
                const currentQtyValue = cartState[p.id] || 0;

                grid.innerHTML += `
                    <div class="product-card">
                        <div class="img-container">
                            <img src="${p.imgUrl}" alt="${p.name}">
                            <span class="badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="product-info">
                            <h3 class="product-title">${p.name}</h3>
                            <div class="stock-indicator">
                                <i data-lucide="boxes" size="14"></i> 
                                ${isAvailable ? `${p.stockCount} units available` : 'Restocking soon'}
                            </div>
                            <div class="price-row">
                                <span class="price-label">Price</span>
                                <span class="price-val">₦${p.price.toLocaleString()}</span>
                            </div>
                            
                            ${isAvailable ? `
                                <div class="quantity-control">
                                    <button class="qty-btn" onclick="changeQty('${p.id}', -1)">-</button>
                                    <input type="number" class="qty-input" id="qty-${p.id}" value="${currentQtyValue}" min="0" max="${p.stockCount}" oninput="handleQtyInput('${p.id}', this.value)">
                                    <button class="qty-btn" onclick="changeQty('${p.id}', 1)">+</button>
                                </div>
                            ` : ''}

                            <button onclick="changeQty('${p.id}', 1)" class="order-btn ${btnDisabled}">
                                <i data-lucide="shopping-cart"></i> ${isAvailable ? 'Add to Order' : 'Restocking'}
                            </button>
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
            calculateCartTotals();
        }

        function populateAdminOptions() {
            const selector = document.getElementById('targetProduct');
            selector.innerHTML = '';
            products.forEach(p => {
                selector.innerHTML += `<option value="${p.id}">${p.name}</option>`;
            });
        }

        function loadProductMetadata() {
            const targetId = document.getElementById('targetProduct').value;
            const item = products.find(p => p.id === targetId);
            if (item) {
                document.getElementById('modifyPrice').value = item.price;
                document.getElementById('modifyStockCount').value = item.stockCount;
            }
        }

        function openAuthModal() {
            document.getElementById('accessPin').value = '';
            document.getElementById('authModal').classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function verifyAccess() {
            const inputPin = document.getElementById('accessPin').value;
            if (inputPin === 'admin123') {
                closeModal('authModal');
                populateAdminOptions();
                loadProductMetadata();
                document.getElementById('adminModal').classList.add('active');
            } else {
                alert('Invalid Security Credentials.');
            }
        }

        function applySystemModifications() {
            const targetId = document.getElementById('targetProduct').value;
            const updatedPrice = parseFloat(document.getElementById('modifyPrice').value);
            const updatedStockCount = parseInt(document.getElementById('modifyStockCount').value) || 0;

            const idx = products.findIndex(p => p.id === targetId);
            if (idx !== -1) {
                products[idx].price = updatedPrice;
                products[idx].stockCount = updatedStockCount;
                
                if (updatedStockCount <= 0 || (cartState[targetId] && cartState[targetId] > updatedStockCount)) {
                     if(updatedStockCount <= 0) {
                         delete cartState[targetId];
                     } else {
                         cartState[targetId] = updatedStockCount;
                     }
                }
                
                renderStorefront();
                closeModal('adminModal');
            }
        }

        window.onload = function() {
            renderStorefront();
        };
    </script>
</body>
</html>
